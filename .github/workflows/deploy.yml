name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: listening-lab/package-lock.json

      - name: Install dependencies
        working-directory: listening-lab
        run: npm ci

      - name: Lint
        working-directory: listening-lab
        run: npm run lint

      - name: Validate exam data
        working-directory: listening-lab
        run: npm run validate

      - name: Build
        working-directory: listening-lab
        run: npm run build

      # public/ 配下（audio 含む）は vite build が dist/ に自動コピーする
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: listening-lab/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
